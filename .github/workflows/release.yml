name: release

# Push a tag like quick-create/v1.2.1 to publish that plugin. The version comes from the tag and
# the release notes from plugins/<plugin>/CHANGELOG.md.
on:
  push:
    tags: ['*/v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: tag
        run: |
          plugin="${GITHUB_REF_NAME%%/v*}"; version="${GITHUB_REF_NAME#*/v}"
          [ -f "plugins/$plugin/plugin.json" ] || { echo "No plugin folder plugins/$plugin" >&2; exit 1; }
          echo "plugin=$plugin" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "id=$(jq -r .id "plugins/$plugin/plugin.json")" >> "$GITHUB_OUTPUT"
          echo "name=$(jq -r .name "plugins/$plugin/plugin.json")" >> "$GITHUB_OUTPUT"
          if [ -d "plugins/$plugin/server" ]; then echo "server=true" >> "$GITHUB_OUTPUT"; else echo "server=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        with:
          node-version-file: plugins/${{ steps.tag.outputs.plugin }}/.node-version
          cache: npm
          cache-dependency-path: plugins/${{ steps.tag.outputs.plugin }}/webapp/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: plugins/${{ steps.tag.outputs.plugin }}/go.mod
          cache-dependency-path: plugins/${{ steps.tag.outputs.plugin }}/go.sum
      - name: Release notes from CHANGELOG.md
        # Fails early if the CHANGELOG has no section for this version.
        env:
          PLUGIN: ${{ steps.tag.outputs.plugin }}
          VERSION: ${{ steps.tag.outputs.version }}
          PLUGIN_ID: ${{ steps.tag.outputs.id }}
        run: |
          .github/release-notes.sh "plugins/$PLUGIN/CHANGELOG.md" "$VERSION" > notes.md
          {
            echo
            echo '### Install'
            echo "Download \`$PLUGIN_ID-$VERSION.tar.gz\` below, then in Mattermost open **System Console → Plugins → Plugin Management → Upload Plugin** and enable it. \`SHA256SUMS\` is attached for verification."
            prev=$(git describe --tags --match "$PLUGIN/v*" --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
            if [ -n "$prev" ]; then
              echo
              echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${prev}...${GITHUB_REF_NAME}"
            fi
          } >> notes.md
          cat notes.md
      - name: Test and build
        working-directory: plugins/${{ steps.tag.outputs.plugin }}
        env:
          HAS_SERVER: ${{ steps.tag.outputs.server }}
        run: |
          make apply
          if [ "$HAS_SERVER" = true ]; then go test -race -count=1 ./server/...; fi
          cd webapp && npm ci && npm run lint && npm run check-types && npm run test-ci && cd ..
          make dist
          test -f "dist/${{ steps.tag.outputs.id }}-${{ steps.tag.outputs.version }}.tar.gz"
      - name: Checksum
        working-directory: plugins/${{ steps.tag.outputs.plugin }}/dist
        run: sha256sum *.tar.gz > SHA256SUMS && cat SHA256SUMS
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          DIST: plugins/${{ steps.tag.outputs.plugin }}/dist
        run: gh release create "$GITHUB_REF_NAME" "$DIST"/*.tar.gz "$DIST/SHA256SUMS" --verify-tag --notes-file notes.md --title "${{ steps.tag.outputs.name }} v${{ steps.tag.outputs.version }}"
